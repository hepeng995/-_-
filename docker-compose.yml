services:
  mysql:
    image: mysql:8.0
    container_name: village-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-village}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./village.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - village-net

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: village-backend
    ports:
      - "7070:7070"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-village}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-change-me}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_HTTP_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - FILE_UPLOAD_PATH=/data/uploads
      - APP_PUBLIC_BASE_URL=${APP_PUBLIC_BASE_URL:-http://localhost:3000}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7070/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - village-net

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: village-front
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - village-net

  front-admin:
    build:
      context: ./front-admin
      dockerfile: Dockerfile
    container_name: village-front-admin
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - village-net

  redis:
    image: redis:7-alpine
    container_name: village-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - village-net

  qdrant:
    image: qdrant/qdrant:1.17.1
    container_name: village-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - village-net

volumes:
  mysql-data:
  uploads:
  redis-data:
  qdrant-data:

networks:
  village-net:
    driver: bridge
