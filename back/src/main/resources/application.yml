server:
  port: ${SERVER_PORT:7070}

# LangChain4j 自动配置插件
langchain4j:
  open-ai:
    chat-model:
      api-key: sk-67eae102ebec4dc99464ef08e40635bd
      model-name: qwen-turbo
      log-responses: true
      log-requests: true
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      max-retries: 1
      timeout: 60s
      temperature: 0.7
      max-tokens: 3092
chroma:
  url: http://localhost:7003
  collection-name: village_knowledge
spring:
  application:
    name: cinema-booking-system

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:village}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:10000ms}

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cinema.booking.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cinema.booking.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted  # 逻辑删除字段
      logic-delete-value: 1        # 删除值
      logic-not-delete-value: 0    # 未删除值
    banner: true                   # 开启mybatis-plus启动图标

# JWT配置
jwt:
  secret-key: ${JWT_SECRET_KEY:cinemaBookingSystemSecretKey12345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000}

# 自定义配置
cinema:
  # 图片上传路径
  image-upload-path: ${IMAGE_UPLOAD_PATH:./uploads/images/}
  # 默认管理员账号
  admin:
    username: ${DEFAULT_ADMIN_USERNAME:admin}
    password: ${DEFAULT_ADMIN_PASSWORD:change-me}
    email: ${DEFAULT_ADMIN_EMAIL:admin@example.com}
  ai:
    embedding-model-name: text-embedding-v3
    qdrant-host: ${QDRANT_HOST:localhost}
    qdrant-http-port: ${QDRANT_HTTP_PORT:6333}
    qdrant-grpc-port: ${QDRANT_GRPC_PORT:6334}
    knowledge-collection: ${QDRANT_COLLECTION:village_knowledge_base_qwen_v3_1024}
    knowledge-vector-size: ${QDRANT_VECTOR_SIZE:1024}
    vector-min-score: ${QDRANT_VECTOR_MIN_SCORE:0.5}
    smoke-test-query: ${QDRANT_SMOKE_TEST_QUERY:有什么特色特产推荐？}
    legacy-collections:
      - village_knowledge_base
    indexing-mode: ${AI_INDEXING_MODE:incremental}

# 和风天气 API 配置
qweather:
  api-key: a2801b72f2e542b996d08fab62b1eade
  base-url: https://devapi.qweather.com
  cache-minutes: 30

# 天聚数行 TianAPI 配置
tianapi:
  api-key: dca880bbcd19bf1e4a26035e524b81b6
  base-url: https://apis.tianapi.com
  nongye-path: /nongye/index
  default-num: 20
  cache-minutes: 60

# 高德地图 API 配置
amap:
  web-key: ${AMAP_WEB_KEY:77e1c564894c0b47491fbe4316f018bf}
  text-search-url: https://restapi.amap.com/v5/place/text
  detail-url: https://restapi.amap.com/v5/place/detail
  connect-timeout: 5000
  read-timeout: 10000
  sync:
    default-region: 全国
    default-page-size: 25

# 文件上传配置
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./files}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:}

# Spring Boot Actuator 健康检查 / 指标
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
info:
  app:
    name: village-revival
    version: 0.0.1-SNAPSHOT
