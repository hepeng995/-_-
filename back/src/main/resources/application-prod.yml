server:
  port: ${SERVER_PORT:7070}

langchain4j:
  open-ai:
    chat-model:
      api-key: sk-67eae102ebec4dc99464ef08e40635bd
      model-name: qwen-turbo
      log-responses: true
      log-requests: true
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      max-retries: 1
      timeout: 60s
      temperature: 0.7
      max-tokens: 3092

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:village}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:10000ms}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

cinema:
  image-upload-path: ${IMAGE_UPLOAD_PATH:/data/uploads/images/}
  ai:
    embedding-model-name: text-embedding-v3
    qdrant-host: ${QDRANT_HOST:qdrant}
    qdrant-http-port: ${QDRANT_HTTP_PORT:6333}
    qdrant-grpc-port: ${QDRANT_GRPC_PORT:6334}
    knowledge-collection: ${QDRANT_COLLECTION:village_knowledge_base_qwen_v3_1024}
    knowledge-vector-size: ${QDRANT_VECTOR_SIZE:1024}
    vector-min-score: ${QDRANT_VECTOR_MIN_SCORE:0.5}
    smoke-test-query: ${QDRANT_SMOKE_TEST_QUERY:有什么特色特产推荐？}
    legacy-collections:
      - village_knowledge_base
  admin:
    username: ${DEFAULT_ADMIN_USERNAME:admin}
    password: ${DEFAULT_ADMIN_PASSWORD:change-me}
    email: ${DEFAULT_ADMIN_EMAIL:admin@example.com}

qweather:
  api-key: a2801b72f2e542b996d08fab62b1eade
  base-url: https://devapi.qweather.com
  cache-minutes: 30

tianapi:
  api-key: dca880bbcd19bf1e4a26035e524b81b6
  base-url: https://apis.tianapi.com
  nongye-path: /nongye/index
  default-num: 20
  cache-minutes: 60

amap:
  web-key: 77e1c564894c0b47491fbe4316f018bf
  text-search-url: https://restapi.amap.com/v5/place/text
  detail-url: https://restapi.amap.com/v5/place/detail
  connect-timeout: 5000
  read-timeout: 10000
  sync:
    default-region: 全国
    default-page-size: 25

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/data/uploads}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
