server:
  port: 7070

spring:
  application:
    name: cinema-booking-system
  
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/village?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000ms

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cinema.booking.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cinema.booking.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted  # 逻辑删除字段
      logic-delete-value: 1        # 删除值
      logic-not-delete-value: 0    # 未删除值
    banner: true                   # 开启mybatis-plus启动图标

# JWT配置
jwt:
  secret-key: cinemaBookingSystemSecretKey12345678901234567890
  expiration: 86400000  # 24小时有效期(毫秒)

# 自定义配置
cinema:
  # 图片上传路径
  image-upload-path: ./uploads/images/
  # 默认管理员账号
  admin:
    username: admin
    password: admin123
    email: admin@cinema.com

# 文件上传配置
file:
  upload:
    path: ../files  # 文件上传保存路径（与back同级的files目录） 